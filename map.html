<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه تعاملی شهر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --set1: #0A0A44;
            --set2: #0D0D5C;
            --set3: #111178;
            --set4: #14148F;
            --set5: #1818AB;
            --text: #FFFFFF;
            --terxt2: #000000;
            --color1: #FFC801;
            --color2: #EDBE13;
            --error: #D92D20;
            
            --bg: var(--set1);
            --card: rgba(13, 13, 92, 0.95);
            --border: rgba(255, 200, 1, 0.15);
            --glow: rgba(255, 200, 1, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: var(--set1);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            height: 100dvh; /* Dynamic Viewport Height for Mobile */
        }

        #map {
            height: 100%;
            width: 100%;
            filter: brightness(0.85) saturate(0.9);
        }

        .leaflet-tile-pane {
            filter: brightness(0.7) contrast(1.1) saturate(0.5) hue-rotate(200deg);
        }

        .leaflet-container {
            background: var(--set1);
        }

        /* Custom Marker */
        .custom-marker {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marker-pin {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--color1), var(--color2));
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 3px solid var(--set1);
            box-shadow: 0 4px 25px var(--glow), 0 0 40px rgba(255, 200, 1, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-marker:hover .marker-pin {
            transform: rotate(-45deg) scale(1.25);
            box-shadow: 0 6px 35px var(--glow), 0 0 60px rgba(255, 200, 1, 0.3);
        }

        .marker-icon {
            transform: rotate(45deg);
            color: var(--terxt2);
            font-size: 15px;
            font-weight: 800;
        }

        .marker-pulse {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 200, 1, 0.25);
            border-radius: 50%;
            animation: pulse 2.5s ease-out infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(0.4); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* Info Panel */
        .info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 360px;
            max-height: calc(100vh - 40px);
            background: linear-gradient(160deg, var(--set3), var(--set2));
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            z-index: 1000;
            backdrop-filter: blur(30px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            transform: translateX(420px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .info-panel.active {
            transform: translateX(0);
        }

        .close-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 38px;
            height: 38px;
            background: rgba(217, 45, 32, 0.15);
            border: 1px solid rgba(217, 45, 32, 0.3);
            border-radius: 12px;
            color: var(--error);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .close-panel:hover {
            background: rgba(217, 45, 32, 0.25);
            transform: rotate(90deg);
        }

        .location-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--color1);
            text-shadow: 0 2px 20px rgba(255, 200, 1, 0.3);
            padding-left: 45px; /* Space for close button */
        }

        .location-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .location-description {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.9;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 200, 1, 0.1);
            border: 1px solid rgba(255, 200, 1, 0.25);
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--color1);
            margin-bottom: 24px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-buttons {
            margin-top: 28px;
        }

        .nav-btn {
            width: 100%; /* Full width since it's the only button */
            padding: 16px 22px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-size: 0.95rem;
            background: linear-gradient(135deg, var(--color1), var(--color2));
            color: var(--terxt2);
            border: none;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 200, 1, 0.4);
        }

        /* Header */
        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            background: linear-gradient(145deg, var(--set3), var(--set2));
            border: 1px solid var(--border);
            border-radius: 18px;
            z-index: 1000;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            transition: right 0.4s ease, transform 0.3s ease, opacity 0.3s ease;
        }

        .header:not(.panel-open) {
            right: 20px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            background-color: var(--set2);
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--text);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--color1), var(--color2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(255, 200, 1, 0.3);
        }

        .logo-icon svg { color: var(--terxt2); }

        .logo-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
        }

        .stats {
            display: flex;
            gap: 28px;
        }
        .stat-item { text-align: center; }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--color1);
        }
        .stat-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Locations List & Toggle */
        .locations-toggle {
            position: fixed; /* Fixed added back */
            bottom: 24px;
            left: 24px;
            padding: 16px 28px;
            background: linear-gradient(145deg, var(--set3), var(--set2));
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .locations-toggle:hover {
            border-color: var(--color1);
            transform: translateY(-3px);
        }
        .locations-toggle svg { color: var(--color1); }

        .locations-list {
            position: fixed;
            bottom: 90px;
            left: 24px;
            width: 340px;
            max-height: 420px;
            background: linear-gradient(160deg, var(--set3), var(--set2));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            z-index: 1001;
            backdrop-filter: blur(20px);
            transform: translateY(20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .locations-list.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .location-item {
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .location-item:hover {
            background: rgba(255, 200, 1, 0.08);
            border-color: var(--color1);
            transform: translateX(-6px);
        }

        .location-item-title { font-weight: 600; margin-bottom: 6px; }
        .location-item-time {
            font-size: 0.8rem;
            color: var(--color1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                top: 0;
                left: 0;
                right: 0;
                border-radius: 0 0 20px 20px;
                padding: 14px 18px;
            }

            /* Hide header when panel is open on mobile */
            .header.panel-open {
                transform: translateY(-100%);
                opacity: 0;
            }

            .stats { display: none; }

            .locations-toggle {
                left: 16px;
                bottom: 16px;
                padding: 12px 20px;
            }

            .locations-list {
                left: 10px;
                right: 10px;
                width: auto;
                bottom: 80px;
                max-height: 50vh;
            }

            .info-panel {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 85vh;
                border-radius: 24px 24px 0 0;
                transform: translateY(100%);
                padding: 24px 20px;
            }
            
            .info-panel.active {
                transform: translateY(0);
            }
            
            .location-title {
                font-size: 1.3rem;
                padding-left: 40px;
            }
        }

        /* Category Badge */
        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 200, 1, 0.15);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--color1);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <header class="header" id="header">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </button>
        <div class="logo">
            <div class="logo-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="10" r="3"/>
                    <path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/>
                </svg>
            </div>
            <span class="logo-text">نقشه شهری</span>
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalLocations">0</div>
                <div class="stat-label">موقعیت فعال</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="todayEvents">0</div>
                <div class="stat-label">رویداد امروز</div>
            </div>
        </div>
    </header>

    <div class="info-panel" id="infoPanel">
        <button class="close-panel" onclick="closePanel()" aria-label="بستن">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <div class="category-badge" id="panelCategory">دسته‌بندی</div>
        <h2 class="location-title" id="panelTitle">نام موقعیت</h2>
        <div class="location-meta">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="10" r="3"/>
                <path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/>
            </svg>
            <span id="panelCoords">35.6892, 51.3890</span>
        </div>
        <div class="time-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
            </svg>
            <span id="panelTime">زمان برگزاری</span>
        </div>
        <p class="location-description" id="panelDescription">توضیحات موقعیت...</p>
        <div class="nav-buttons">
            <a href="#" class="nav-btn" id="googleBtn" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                مسیریابی در گوگل مپ
            </a>
        </div>
    </div>

  
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
        لیست رویدادها
    </button>

    <div class="locations-list" id="locationsList"></div>

    <script>
        // Location Data
        const locationsData = [
            {
                id: 1,
                name: "برج میلاد",
                description: "برج میلاد تهران، یکی از بلندترین برج‌های جهان و نماد شهر تهران است.",
                time: "۱۴۰۳/۰۹/۱۵ - ساعت ۱۰:۰۰",
                lat: 35.7448,
                lng: 51.3748,
                category: "جاذبه گردشگری"
            },
            {
                id: 2,
                name: "میدان ولیعصر",
                description: "میدان ولیعصر یکی از مهم‌ترین میادین تهران...",
                time: "۱۴۰۳/۰۹/۱۶ - ساعت ۱۸:۰۰",
                lat: 35.7110,
                lng: 51.4085,
                category: "میدان"
            },
            {
                id: 3,
                name: "پارک لاله",
                description: "پارک لاله یکی از قدیمی‌ترین پارک‌های تهران...",
                time: "۱۴۰۳/۰۹/۱۷ - ساعت ۰۸:۰۰",
                lat: 35.7226,
                lng: 51.3933,
                category: "پارک"
            }
            ,            {
                id: 5,
                name: "برج میyrtyeryلاد",
                description: "برج میلاد تهران، یکی از بلندترین برج‌های جهان و نماد شهر تهران است.",
                time: "۱۴۰۳/۰۹/۱۵ - ساعت ۱۰:۰۰",
                lat: 35.8448,
                lng: 51.3748,
                category: "جاذبه گردشگری"
            },
                        {
                id: 6,
                name: "برجkir ali shagheلاد",
                description: "بkir ali  تهران، یکی از بلندترین برج‌های جهان و نماد شهر تهران است.",
                time: "۱۴۰۳/۰۹/۱۵ - ساعت ۱۰:۰۰",
                lat: 50.866,
                lng: 51.3748,
                category: "جاذبه گردشگری"
            }
            
        ];

        let map = null;
        let markers = [];

        function initMap() {
            map = L.map('map', {
                center: [35.7219, 51.3890],
                zoom: 12
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            addMarkers();
            populateLocationsList();
            document.getElementById('totalLocations').textContent = locationsData.length;
            document.getElementById('todayEvents').textContent = Math.min(3, locationsData.length);
        }

        function addMarkers() {
            locationsData.forEach((location) => {
                const markerHtml = `
                    <div class="custom-marker">
                        <div class="marker-pulse"></div>
                        <div class="marker-pin">
                            <span class="marker-icon">${location.id}</span>
                        </div>
                    </div>`;

                const customIcon = L.divIcon({ html: markerHtml, className: '', iconSize: [44, 44], iconAnchor: [22, 44] });
                const marker = L.marker([location.lat, location.lng], { icon: customIcon }).addTo(map);
                
                marker.on('click', () => showLocationInfo(location));
                markers.push(marker);
            });
        }

        function showLocationInfo(location) {
            // Close list if open
            document.getElementById('locationsList').classList.remove('active');
            
            // On mobile, hide header to make space
            if(window.innerWidth <= 768) {
                document.getElementById('header').classList.add('panel-open');
            }

            document.getElementById('panelTitle').textContent = location.name;
            document.getElementById('panelCategory').textContent = location.category;
            document.getElementById('panelCoords').textContent = `${location.lat.toFixed(4)}, ${location.lng.toFixed(4)}`;
            document.getElementById('panelTime').textContent = location.time;
            document.getElementById('panelDescription').textContent = location.description;

            document.getElementById('googleBtn').href = `https://www.google.com/maps/search/?api=1&query=${location.lat},${location.lng}`;

            document.getElementById('infoPanel').classList.add('active');
            map.setView([location.lat, location.lng], 15, { animate: true });
        }

        function closePanel() {
            document.getElementById('infoPanel').classList.remove('active');
            // Restore header on mobile
            document.getElementById('header').classList.remove('panel-open');
        }

        function toggleLocationsList() {
            document.getElementById('locationsList').classList.toggle('active');
        }

        function populateLocationsList() {
            const list = document.getElementById('locationsList');
            list.innerHTML = locationsData.map(loc => `
                <div class="location-item" onclick="flyToLocationById(${loc.id})">
                    <div class="location-item-title">${loc.name}</div>
                    <div class="location-item-time">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        ${loc.time}
                    </div>
                </div>
            `).join('');
        }

        function flyToLocationById(id) {
            const location = locationsData.find(l => l.id === id);
            if (location) {
                showLocationInfo(location);
            }
        }

        document.addEventListener('DOMContentLoaded', initMap);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePanel();
                document.getElementById('locationsList').classList.remove('active');
            }
        });
    </script>
</body>
</html>
