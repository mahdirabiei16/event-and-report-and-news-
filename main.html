   <style>
        :root {
            --bg-primary: #0a1628;
            --bg-secondary: #0f2140;
            --accent-gold: #f5b942;
            --accent-gold-dark: #d4a23a;
            --text-primary: #ffffff;
            --text-secondary: #8b9fc5;
            --blur-purple-1: #dbed3a;
            --blur-purple-2: #f7ec55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content:space-between;
            padding: 20px;
            gap: 8px;
        }

        .header-icon {
            width: 24px;
            height: 24px;
            color: var(--accent-gold);
        }

        .header-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        /* Purple Blur Orb */
        .orb-container {
            position: relative;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: space-between;

        }

        .blur-orb {
            width: 300px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--blur-purple-2) 0%, var(--blur-purple-1) 60%, transparent 100%);
            filter: blur(40px);
            opacity: 0.7;
            animation: pulse 4s ease-in-out infinite;
        }

        .blur-orb-inner {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.8) 0%, rgba(124, 58, 237, 0.4) 70%, transparent 100%);
            filter: blur(25px);
            animation: pulse 3s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.9;
            }
        }

        /* Buttons Grid */
        .buttons-container {
            padding: 24px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .feature-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .button-square {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 12px rgba(245, 185, 66, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .button-square::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
            border-radius: 12px 12px 0 0;
        }

        .button-square:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 
                0 8px 24px rgba(245, 185, 66, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .button-square:active {
            transform: translateY(-2px) scale(1.02);
        }

        .button-square.active {
            background: linear-gradient(145deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 
                0 4px 12px rgba(34, 197, 94, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .button-square.active:hover {
            box-shadow: 
                0 8px 24px rgba(34, 197, 94, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .prohibit-icon {
            width: 36px;
            height: 36px;
            color: #1a1a1a;
            transition: all 0.3s ease;
        }

        .button-square.active .prohibit-icon {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }

        .check-icon {
            position: absolute;
            width: 36px;
            height: 36px;
            color: #ffffff;
            opacity: 0;
            transform: rotate(-90deg) scale(0);
            transition: all 0.3s ease;
        }

        .button-square.active .check-icon {
            opacity: 1;
            transform: rotate(0) scale(1);
        }

        .button-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            transition: color 0.3s ease;
        }

        .feature-button:hover .button-label {
            color: var(--text-primary);
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(168, 85, 247, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Bottom glow */
        .bottom-glow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: radial-gradient(ellipse, rgba(245, 185, 66, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .blur-orb,
            .blur-orb-inner {
                animation: none;
            }
            .button-square {
                transition: none;
            }
        }
        .menu-btn svg {
            width: 40px;
            height: 40px;
            color: var(--text-primary);
         
            
        }
        .ddd {
            right: 20px !important;

             align-items: center;
             font-size: 1.25rem;
             font-weight: 600;
             color: var(--text-primary);
             letter-spacing: 0.5px;
        }
        
    </style>

    <script>
        // Button toggle interaction
        const buttons = document.querySelectorAll('.button-square');
        


        // Ripple effect function
        function createRipple(element, event) {
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                left: ${x}px;
                top: ${y}px;
                background: rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                transform: scale(0);
                animation: ripple 0.6s ease-out;
                pointer-events: none;
            `;
            
            element.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        }

        // Add ripple animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2.5);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Floating particles animation
        function createParticle() {
            const container = document.querySelector('.orb-container');
            if (!container) return;
            
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const startX = Math.random() * 100 + 100;
            const startY = Math.random() * 100 + 50;
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            
            container.appendChild(particle);
            
            // Animate particle
            const duration = 2000 + Math.random() * 2000;
            const targetY = startY - 50 - Math.random() * 50;
            const targetX = startX + (Math.random() - 0.5) * 60;
            
            particle.animate([
                { transform: 'translateY(0) translateX(0) scale(1)', opacity: 0.6 },
                { transform: `translateY(${targetY - startY}px) translateX(${targetX - startX}px) scale(0)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'ease-out'
            });
            
            setTimeout(() => particle.remove(), duration);
        }

        // Create particles periodically
        setInterval(createParticle, 300);







        
    </script>
    <script>

               // ========== وقتی صفحه کاملاً بارگذاری شد ==========
        document.addEventListener('DOMContentLoaded', function() {
            
            // ========== تنظیمات اولیه ==========
            let menuOpen = false;

            // ========== ایجاد منوی کشویی ==========
            const createSideMenu = () => {
                // ایجاد المان منوی کشویی
                const sideMenu = document.createElement('div');
                sideMenu.id = 'sideMenu';
                sideMenu.style.cssText = `
                    position: fixed !important;
                    top: 0;
                    right: -250px;
                    width: 250px;
                    height: 100vh;
                    background-color: #0D0D5C!important;
                    transition: right 0.3s ease !important;
                    z-index: 1000 !important;
                    box-shadow: -2px 0 10px rgba(0,0,0,0.3);
                `;

                // محتوای منو
                sideMenu.innerHTML = `
                    <div style="padding: 20px;">
                        <h3 style="color: var(--text); margin-bottom: 30px;">منوی اصلی</h3>
                        <ul style="list-style: none;">
                            <li style="margin-bottom: 15px;">
                                <a href="./main.html" style="color: var(--color1); text-decoration: none; font-size: 16px;">صفحه اصلی</a>
                            </li>

                            <li style="margin-bottom: 15px;">
                                <a href="./user.html" style="color: var(--color1); text-decoration: none; font-size: 16px;" onclick="location.href='./user.html'">داشبورد</a>
                            </li>
                            
                            <li style="margin-bottom: 15px;">
                                <a href="#" style="color: var(--color1); text-decoration: none; font-size: 16px;">تماس با ما</a>
                            </li>
                        </ul>
                    </div>
                `;

                document.body.appendChild(sideMenu);

                // ایجاد overlay برای بستن منو
                const overlay = document.createElement('div');
                overlay.id = 'menuOverlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-color: rgba(0,0,0,0.5);
                    z-index: 999;
                    display: none;
                `;
                overlay.addEventListener('click', toggleMenu);
                document.body.appendChild(overlay);
            };

            // ========== تابع باز و بسته کردن منو ==========
            const toggleMenu = () => {
                const sideMenu = document.getElementById('sideMenu');
                const overlay = document.getElementById('menuOverlay');
                
                if (menuOpen) {
                    sideMenu.style.right = '-250px';
                    overlay.style.display = 'none';
                    menuOpen = false;
                } else {
                    sideMenu.style.right = '0';
                    overlay.style.display = 'block';
                    menuOpen = true;
                }
            };

            // ========== اضافه کردن event listener به دکمه منو ==========
            const menuBtn = document.querySelector('.menu-btn');
            if (menuBtn) {
                menuBtn.addEventListener('click', toggleMenu);
            }

            // ایجاد منو در ابتدا
            createSideMenu();

            // ========== مدیریت کلیدهای میانبر ==========
            document.addEventListener('keydown', function(e) {
                // ESC برای بستن منو
                if (e.key === 'Escape' && menuOpen) {
                    toggleMenu();
                }
            });

        });</script>
