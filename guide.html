<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آموزش تعاملی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --set1: #0A0A44;
            --set2: #0D0D5C;
            --set3: #111178;
            --set4: #14148F;
            --set5: #1818AB;
            --text: #FFFFFF;
            --terxt2: #000000;
            --color1: #FFC801;
            --color2: #EDBE13;
            --error: #D92D20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--set1);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(20, 20, 143, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255, 200, 1, 0.08) 0%, transparent 50%);
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: floatOrb 12s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 300px;
            height: 300px;
            background: var(--set4);
            opacity: 0.3;
            top: -100px;
            right: -50px;
        }

        .bg-orb-2 {
            width: 250px;
            height: 250px;
            background: var(--set2);
            opacity: 0.4;
            bottom: 20%;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
        }

        /* Main content */
        .main-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            padding-top: env(safe-area-inset-top, 16px);
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 8px 0;
        }

        .header-title {
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .close-btn-header {
            width: 40px;
            height: 40px;
            background: var(--set2);
            border: 1px solid var(--set3);
            border-radius: 12px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn-header:hover {
            background: var(--set4);
            border-color: var(--set5);
        }

        .close-btn-header:active {
            transform: scale(0.95);
        }

        /* Video section */
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .video-wrapper {
            position: relative;
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            background: var(--set2);
            border: 1px solid var(--set3);
            min-height: 200px;
            cursor: pointer;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to top, 
                rgba(10, 10, 68, 0.95) 0%, 
                rgba(10, 10, 68, 0.4) 30%,
                transparent 50%
            );
            pointer-events: none;
            z-index: 1;
        }

        .video-info {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 20px;
            z-index: 5;
        }

        .part-indicator {
            display: inline-block;
            background: var(--color1);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--terxt2);
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .video-title {
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Play Button Overlay */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: var(--color1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 200, 1, 0.4);
        }

        .play-overlay:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 40px rgba(255, 200, 1, 0.6);
        }

        .play-overlay svg {
            width: 30px;
            height: 30px;
            fill: var(--terxt2);
            margin-right: -3px; /* Visual centering for play icon */
        }

        .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }

        /* Progress indicators */
        .progress-section {
            padding: 20px 0;
        }

        .progress-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            display: flex;
            gap: 12px;
        }

        .progress-item {
            flex: 1;
            height: 8px;
            background: var(--set2);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--set3);
        }

        .progress-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--color2) 0%, var(--color1) 100%);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .progress-item.active .progress-fill {
            width: 100%;
        }

        .progress-item.current .progress-fill {
            width: 0;
            animation: fillProgress 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fillProgress {
            to { width: 100%; }
        }

        /* Description */
        .description-section {
            padding-bottom: 16px;
        }

        .description-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            line-height: 1.9;
        }

        /* Buttons */
        .buttons-section {
            display: flex;
            gap: 12px;
            padding-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 16px 20px;
            border-radius: 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            border: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-close {
            background: var(--set2);
            color: var(--text);
            border: 1px solid var(--set3);
        }

        .btn-close:hover {
            background: var(--set3);
            border-color: var(--set4);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--color1) 0%, var(--color2) 100%);
            color: var(--terxt2);
            box-shadow: 0 4px 20px rgba(255, 200, 1, 0.2);
        }

        .btn-start:hover {
            box-shadow: 0 6px 25px rgba(255, 200, 1, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 380px) {
            .main-content {
                padding: 12px;
            }

            .btn {
                padding: 14px 16px;
                font-size: 0.9rem;
            }

            .video-title {
                font-size: 1rem;
            }

            .play-overlay {
                width: 60px;
                height: 60px;
            }
        }

        @media (min-width: 768px) {
            .main-content {
                max-width: 600px;
                margin: 0 auto;
                padding: 24px;
            }

            .video-wrapper {
                min-height: 300px;
            }
        }

        /* Safe area for notch phones */
        @supports (padding: env(safe-area-inset-bottom)) {
            .buttons-section {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background layer -->
    <div class="bg-layer">
        <div class="bg-gradient"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <span class="header-title">آموزش برنامه</span>
            <button class="close-btn-header" onclick="closeModal()" aria-label="بستن">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Video section -->
        <div class="video-section">
            <div class="video-wrapper" id="videoWrapper">
                <video id="tutorialVideo" playsinline>
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>
                
                <!-- Play Button -->
                <div class="play-overlay" id="playOverlay">
                    <svg viewBox="0 0 24 24" id="playIcon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>

                <div class="video-overlay"></div>
                <div class="video-info">
                    <span class="part-indicator" id="partIndicator">Part 1</span>
                    <h2 class="video-title" id="videoTitle">How to get started</h2>
                </div>
            </div>
        </div>

        <!-- Progress indicators -->
        <div class="progress-section">
            <div class="progress-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12,6 12,12 16,14"/>
                </svg>
                <span>پیشرفت آموزش</span>
            </div>
            <div class="progress-track">
                <div class="progress-item current" id="progress-1">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-item" id="progress-2">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-item" id="progress-3">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="description-section">
            <p class="description-text" id="descriptionText">
                در این بخش یاد می‌گیرید چگونه با برنامه کار کنید و از امکانات آن استفاده کنید. ویدیو را تماشا کنید و سپس روی دکمه شروع کلیک کنید.
            </p>
        </div>

        <!-- Buttons -->
        <div class="buttons-section">
            <button class="btn btn-start" id="startBtn" onclick="nextVideo(event)">
                شروع
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
            <button class="btn btn-close" onclick="closeModal()">
                بستن
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Tutorial data
        const tutorials = [
            {
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                part: "Part 1",
                title: "How to get started",
                description: "در این بخش یاد می‌گیرید چگونه با برنامه کار کنید و از امکانات آن استفاده کنید. ویدیو را تماشا کنید و سپس روی دکمه شروع کلیک کنید."
            },
            {
                src: "https://www.w3schools.com/html/movie.mp4",
                part: "Part 2",
                title: "Advanced Features",
                description: "در این قسمت با امکانات پیشرفته برنامه آشنا می‌شوید. تنظیمات شخصی‌سازی و میانبرهای کاربردی را یاد می‌گیرید."
            },
            {
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                part: "Part 3",
                title: "Tips & Tricks",
                description: "در این بخش نکات و ترفندهای کاربردی را یاد می‌گیرید که به شما کمک می‌کند از برنامه به بهترین شکل استفاده کنید."
            }
        ];

        // State
        let currentStep = 0;

        // DOM elements
        const video = document.getElementById('tutorialVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const playOverlay = document.getElementById('playOverlay');
        const playIcon = document.getElementById('playIcon');
        const partIndicator = document.getElementById('partIndicator');
        const videoTitle = document.getElementById('videoTitle');
        const descriptionText = document.getElementById('descriptionText');
        const startBtn = document.getElementById('startBtn');

        // --- Video Player Logic ---

        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function updatePlayButton() {
            if (video.paused) {
                playOverlay.classList.remove('hidden');
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play Icon
            } else {
                playOverlay.classList.add('hidden');
                playIcon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'; // Pause Icon
            }
        }

        // Click events
        videoWrapper.addEventListener('click', function(e) {
            // Prevent clicks on info section from triggering play (though pointer-events:none handles this mostly)
            if (!e.target.closest('.video-info')) {
                togglePlay();
            }
        });

        // Sync UI with video state
        video.addEventListener('play', updatePlayButton);
        video.addEventListener('pause', updatePlayButton);
        video.addEventListener('ended', function() {
             // Optional: Auto go to next? Or just show replay?
             // Currently shows play button again (paused state)
             updatePlayButton(); 
        });

        // --- Tutorial Navigation Logic ---

        function nextVideo(event) {
            // Ripple effect
            createRipple(event, startBtn);

            // Mark current progress as complete
            const currentProgress = document.getElementById('progress-' + (currentStep + 1));
            if (currentProgress) {
                currentProgress.classList.remove('current');
                currentProgress.classList.add('active');
            }

            currentStep++;

            // Check if completed
            if (currentStep >= tutorials.length) {
                showComplete();
                return;
            }

            // Transition video
            video.style.opacity = '0';
            playOverlay.classList.add('hidden'); // Hide during transition

            setTimeout(function() {
                const tutorial = tutorials[currentStep];
                
                video.src = tutorial.src;
                video.load();
                
                partIndicator.textContent = tutorial.part;
                videoTitle.textContent = tutorial.title;
                descriptionText.textContent = tutorial.description;

                // Update button text
                if (currentStep === tutorials.length - 1) {
                    startBtn.innerHTML = 'تکمیل <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>';
                } else {
                    startBtn.innerHTML = 'بعدی <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
                }

                // Mark next progress
                const nextProgress = document.getElementById('progress-' + (currentStep + 1));
                if (nextProgress) {
                    nextProgress.classList.add('current');
                }

                video.style.opacity = '1';
                // Show play button for new video
                updatePlayButton(); 
            }, 300);
        }

        function showComplete() {
            location.href='./main.html'
            startBtn.disabled = true;
            startBtn.innerHTML = 'تکمیل شد <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>';
            descriptionText.innerHTML = '<span style="color: var(--color1); font-weight: 500;">آموزش با موفقیت تکمیل شد!</span>';
        }

        function closeModal() {
            // Reset to first tutorial
            currentStep = 0;
            
            const tutorial = tutorials[0];
            video.src = tutorial.src;
            video.load();
            
            partIndicator.textContent = tutorial.part;
            videoTitle.textContent = tutorial.title;
            descriptionText.textContent = tutorial.description;

            startBtn.disabled = false;
            startBtn.innerHTML = 'شروع <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

            // Reset progress
            for (let i = 1; i <= 3; i++) {
                const progress = document.getElementById('progress-' + i);
                progress.classList.remove('active', 'current');
            }
            document.getElementById('progress-1').classList.add('current');
            
            // Reset video state
            video.pause();
            updatePlayButton();
        }

        // Ripple effect
        function createRipple(event, button) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            
            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';
            ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';
            
            button.appendChild(ripple);
            
            setTimeout(function() {
                ripple.remove();
            }, 600);
        }
    </script>
</body>
</html>
