<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایجاد رویداد جدید</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vazirmatn Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 1. Leaflet CSS (For Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- 2. Persian Datepicker CSS -->
    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>

    <style>
        :root {
            --set1: #0A0A44;
            --set2: #0D0D5C;
            --set3: #111178;
            --set4: #14148F;
            --set5: #1818AB;
            --text: #FFFFFF;
            --text2: #000000;
            --color1: #FFC801;
            --color2: #EDBE13;
            --error: #D92D20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(180deg, var(--set1) 0%, var(--set2) 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 68, 0.95);
            backdrop-filter: blur(15px);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 200, 1, 0.1);
        }

        .header-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color1);
        }

        .header-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .header-btn:hover { background: rgba(255, 200, 1, 0.15); }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Upload Area */
        .upload-box {
            background: linear-gradient(135deg, var(--color1), var(--color2));
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 15px 40px rgba(255, 200, 1, 0.15);
            transition: transform 0.3s ease;
        }

        .upload-box:hover { transform: translateY(-5px); }

        .upload-icon-wrapper {
            width: 80px;
            height: 80px;
            background: var(--set1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .upload-text { color: var(--set1); font-weight: 700; font-size: 1.1rem; }
        .upload-sub { color: var(--set2); font-size: 0.85rem; margin-top: 0.5rem; }

        /* Image Preview */
        .preview-container {
            display: none;
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .preview-container.active { display: block; }
        .preview-container img { width: 100%; height: 100%; object-fit: cover; }

        .delete-btn {
            position: absolute; top: 12px; left: 12px;
            width: 36px; height: 36px;
            background: var(--error); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }

        /* Form Groups */
        .form-group { margin-bottom: 1.25rem; }

        .form-label {
            display: flex; align-items: center; gap: 0.5rem;
            margin-bottom: 0.6rem; font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color1);
            background: rgba(255, 200, 1, 0.05);
            box-shadow: 0 0 0 4px rgba(255, 200, 1, 0.1);
        }

        textarea.form-input { min-height: 120px; resize: none; }

        /* Map Button */
        .map-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .map-btn:hover { background: rgba(255, 200, 1, 0.08); border-color: rgba(255, 200, 1, 0.3); }

        .map-icon-box {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--color1), var(--color2));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .map-info { flex: 1; text-align: right; }
        .map-title { font-weight: 600; color: var(--text); display: block; }
        .map-desc { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); margin-top: 4px; display: block; }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--color1), var(--color2));
            color: var(--set1);
            border: none;
            border-radius: 14px;
            padding: 1.2rem;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 200, 1, 0.2);
        }
        .submit-btn:active { transform: scale(0.98); }

        /* Map Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            width: 100%; max-width: 500px;
            background: var(--set2);
            border-radius: 24px 24px 0 0;
            height: 80vh;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--set1);
            border-radius: 24px 24px 0 0;
        }

        /* Leaflet Map Container Fix */
        #mapid {
            flex: 1;
            width: 100%;
            background: #1a1a4e;
        }
        /* Fix for leaflet controls in RTL */
        .leaflet-control-container { direction: ltr; }

        .modal-actions {
            padding: 1.5rem;
            background: var(--set1);
        }

        .confirm-loc-btn {
            width: 100%;
            background: var(--color1);
            color: var(--set1);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Datepicker Dark Theme Override */
        .datepicker-container {
            font-family: 'Vazirmatn', sans-serif !important;
        }
        /* This targets the picker modal specifically */
        .datepicker-plot-area-btns, .datepicker-container {
            background: var(--set2) !important;
            color: white !important;
            border-radius: 12px !important;
        }
        .datepicker-plot-area-btns:hover {
            background: var(--set3) !important;
        }
        /* This makes the picker inputs visible if needed */
        input.pwt-btn { 
            color: var(--text) !important;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color1)" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </div>
        <div class="header-title">ایجاد رویداد جدید</div>
        <div class="header-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
            </svg>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Upload Section -->
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        
        <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon-wrapper">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color1)" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </div>
            <span class="upload-text">افزودن تصویر رویداد</span>
            <span class="upload-sub">فرمت‌های مجاز: JPG, PNG</span>
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="previewImage" src="" alt="Event Image">
            <div class="delete-btn" onclick="removeImage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
        </div>

        <!-- Form Fields -->
        <div class="form-group">
            <label class="form-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color1)" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                عنوان رویداد
            </label>
            <input type="text" class="form-input" placeholder="مثال: جشنواره تابستانی">
        </div>

        <div class="form-group">
            <label class="form-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color1)" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                تاریخ و ساعت برگزاری
            </label>
            <!-- Persian Date Input -->
            <input type="text" id="persianDateInput" class="form-input" placeholder="انتخاب تاریخ..." autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color1)" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                موقعیت مکانی
            </label>
            <div class="map-btn" onclick="openMapModal()">
                <div class="map-icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--set1)" stroke-width="2">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
                        <line x1="8" y1="2" x2="8" y2="18"/>
                        <line x1="16" y1="6" x2="16" y2="22"/>
                    </svg>
                </div>
                <div class="map-info">
                    <span class="map-title" id="locationText">انتخاب از نقشه</span>
                    <span class="map-desc" id="locationDesc">موقعیت دقیق را روی نقشه مشخص کنید</span>
                </div>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color1)" stroke-width="2">
                    <line x1="17" y1="10" x2="3" y2="10"/>
                    <line x1="21" y1="6" x2="3" y2="6"/>
                    <line x1="21" y1="14" x2="3" y2="14"/>
                    <line x1="17" y1="18" x2="3" y2="18"/>
                </svg>
                توضیحات
            </label>
            <textarea class="form-input" placeholder="توضیحات تکمیلی درباره رویداد..."></textarea>
        </div>

        <button class="submit-btn" onclick="submitEvent()">ثبت رویداد</button>

    </main>

    <!-- Map Modal -->
    <div class="modal-overlay" id="mapModal" onclick="if(event.target === this) closeMapModal()">
        <div class="modal-content">
            <div class="modal-header">
                <span style="font-weight:700">انتخاب موقعیت مکانی</span>
                <svg onclick="closeMapModal()" style="cursor:pointer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
            <!-- Leaflet Map Container -->
            <div id="mapid"></div>
            <div class="modal-actions">
                <button class="confirm-loc-btn" onclick="confirmLocation()">تایید موقعیت</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- jQuery (Required for Persian Datepicker) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Persian Datepicker JS -->
    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

    <script>
        // --- Image Upload Logic ---
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    uploadBox.style.display = 'none';
                    previewContainer.classList.add('active');
                }
                reader.readAsDataURL(file);
            }
        });

        function removeImage() {
            previewImage.src = '';
            previewContainer.classList.remove('active');
            uploadBox.style.display = 'flex';
            fileInput.value = '';
        }

        // --- Persian Date Picker Init ---
        $(document).ready(function() {
            $("#persianDateInput").persianDatepicker({
                format: 'YYYY/MM/DD HH:mm',
                timePicker: {
                    enabled: true
                },
                initialValue: false,
                initialValueType: 'persian',
                autoClose: false,
                position: ['auto', 'auto'],
                altFormat: 'lll',
                // Styling integration
                toolbox: {
                    calendarSwitch: {
                        enabled: true
                    }
                },
                observer: true,
                inputFormat: 'YYYY/MM/DD HH:mm'
            });
        });

        // --- Map Logic (Leaflet) ---
        const mapModal = document.getElementById('mapModal');
        const locationText = document.getElementById('locationText');
        const locationDesc = document.getElementById('locationDesc');
        
        let map = null;
        let marker = null;
        const defaultTehran = [35.6892, 51.3890];

        function openMapModal() {
            mapModal.classList.add('active');
            
            // Initialize map only once
            if (!map) {
                map = L.map('mapid').setView(defaultTehran, 13);
                
                // Load OpenStreetMap tiles
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);

                // Add click event to map
                map.on('click', onMapClick);
            }
            
            // Force map resize to fit the modal
            setTimeout(() => {
                map.invalidateSize();
            }, 100);
        }

        function onMapClick(e) {
            const lat = e.latlng.lat.toFixed(5);
            const lng = e.latlng.lng.toFixed(5);

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
            
            // Update UI text temporarily
            locationText.textContent = `موقعیت انتخاب شد`;
            locationDesc.textContent = `عرض: ${lat} - طول: ${lng}`;
        }

        function closeMapModal() {
            mapModal.classList.remove('active');
        }

        function confirmLocation() {
            if (marker) {
                // Success state
                locationText.textContent = 'موقعیت تایید شد';
                locationText.style.color = '#4ADE80';
                closeMapModal();
                
                // Reset color after a while
                setTimeout(() => {
                    locationText.style.color = 'var(--text)';
                }, 3000);
            } else {
                alert("لطفا روی نقشه کلیک کنید تا موقعیت را مشخص کنید.");
            }
        }

        function submitEvent() {
            const btn = document.querySelector('.submit-btn');
            btn.innerHTML = 'در حال ثبت...';
            btn.style.opacity = '0.7';
            
            setTimeout(() => {
                btn.innerHTML = 'ثبت شد';
                btn.style.background = '#4ADE80';
                
                setTimeout(() => {
                    btn.innerHTML = 'ثبت رویداد';
                    btn.style.background = '';
                    btn.style.opacity = '1';
                }, 2000);
            }, 1500);
        }
    </script>
</body>
</html>
