<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات پروفایل - قم من</title>
    <style>
        :root {
            --set1: #0A0A44;
            --set2: #0D0D5C;
            --set3: #111178;
            --set4: #14148F;
            --set5: #1818AB;
            --text: #FFFFFF;
            --terxt2: #000000;
            --color1: #FFC801;
            --color2: #EDBE13;
            --error: #D92D20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background-color: var(--set1);
            min-height: 100vh;
            direction: rtl;
        }

        /* Top Navigation Bar - Menu button and logo */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            background-color: var(--set2);
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .menu-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text);
        }

        .app-title {
            color: var(--text);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-logo {
            width: 28px;
            height: 28px;
        }

        /* Main Content Section */
        .main-content {
            padding: 0 16px;
        }

        /* Profile Card Section - User avatar and info */
        .profile-card {
            background-color: var(--set2);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-container {
            position: relative;
            margin-bottom: 16px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, #808080 25%, transparent 25%),
                linear-gradient(-45deg, #808080 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #808080 75%),
                linear-gradient(-45deg, transparent 75%, #808080 75%);
            background-size: 10px 10px;
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
            background-color: #a0a0a0;
        }

        .online-status {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background-color: #22C55E;
            border-radius: 50%;
            border: 2px solid var(--set2);
        }

        .user-name {
            color: var(--text);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .user-email {
            color: var(--text);
            font-size: 13px;
            opacity: 0.8;
        }

        /* Settings Section - Menu items */
        .settings-section {
            background-color: var(--set2);
            border-radius: 16px;
            padding: 16px;
        }

        .settings-title {
            color: var(--text);
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 12px;
            padding-right: 8px;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 12px;
            background-color: var(--set3);
            border-radius: 10px;
            cursor: pointer;
        }

        .settings-item-text {
            color: var(--text);
            font-size: 14px;
        }

        .settings-item-icon {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar - Menu button and logo -->
    <div class="top-nav">
        <button class="menu-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
        </button>
        <div class="app-title" onclick="location.href='./main.html'">
            <span>قم من</span>
            <svg class="app-logo" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
<img src="./logo 1.png" alt="">
            </svg>
        </div>
    </div>
    <!-- Main Content Section -->
    <div class="main-content">
        
        <!-- Profile Card Section - User avatar and info -->
        <div class="profile-card">
            <div class="avatar-container">
                <div class="avatar">
                    <div class="image-placeholder"></div>
                </div>
                <div class="online-status"></div>
            </div>
            <h2 class="user-name">Phoenix Baker</h2>
            <p class="user-email">meysam1289@gmail.com</p>
        </div>

        <!-- Settings Section - Menu items -->
        <div class="settings-section">
            <p class="settings-title">اطلاعات کاربر</p>
            <div class="settings-list">
                
                <!-- Settings Item - Account Settings -->
                <div class="settings-item">
                    <span class="settings-item-text">تنظیمات اکانت</span>
                    <svg class="settings-item-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <!-- Settings Item - Password -->
                <div class="settings-item">
                    <span class="settings-item-text">پسورد</span>
                    <svg class="settings-item-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <!-- Settings Item - Logout -->
                <div class="settings-item">
                    <span class="settings-item-text">خروج از حساب من</span>
                    <svg class="settings-item-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

            </div>
        </div>

    </div>

</body><script>
                // ========== وقتی صفحه کاملاً بارگذاری شد ==========
        document.addEventListener('DOMContentLoaded', function() {
            
            // ========== تنظیمات اولیه ==========
            let menuOpen = false;

            // ========== ایجاد منوی کشویی ==========
            const createSideMenu = () => {
                // ایجاد المان منوی کشویی
                const sideMenu = document.createElement('div');
                sideMenu.id = 'sideMenu';
                sideMenu.style.cssText = `
                    position: fixed;
                    top: 0;
                    right: -250px;
                    width: 250px;
                    height: 100vh;
                    background-color: var(--set2);
                    transition: right 0.3s ease;
                    z-index: 1000;
                    box-shadow: -2px 0 10px rgba(0,0,0,0.3);
                `;

                // محتوای منو
                sideMenu.innerHTML = `
                    <div style="padding: 20px;">
                        <h3 style="color: var(--text); margin-bottom: 30px;">منوی اصلی</h3>
                        <ul style="list-style: none;">
                            <li style="margin-bottom: 15px;">
                                <a href="./main.html" style="color: var(--color1); text-decoration: none; font-size: 16px;">صفحه اصلی</a>
                            </li>
                            <li style="margin-bottom: 15px;">
                                <a  style="color: var(--color1); text-decoration: none; font-size: 16px;" onclick="location.href='./user.html'">داشبورد</a>
                            </li>

                            </li>
                            <li style="margin-bottom: 15px;">
                                <a href="#" style="color: var(--color1); text-decoration: none; font-size: 16px;">تماس با ما</a>
                            </li>
                        </ul>
                    </div>
                `;

                document.body.appendChild(sideMenu);

                // ایجاد overlay برای بستن منو
                const overlay = document.createElement('div');
                overlay.id = 'menuOverlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-color: rgba(0,0,0,0.5);
                    z-index: 999;
                    display: none;
                `;
                overlay.addEventListener('click', toggleMenu);
                document.body.appendChild(overlay);
            };

            // ========== تابع باز و بسته کردن منو ==========
            const toggleMenu = () => {
                const sideMenu = document.getElementById('sideMenu');
                const overlay = document.getElementById('menuOverlay');
                
                if (menuOpen) {
                    sideMenu.style.right = '-250px';
                    overlay.style.display = 'none';
                    menuOpen = false;
                } else {
                    sideMenu.style.right = '0';
                    overlay.style.display = 'block';
                    menuOpen = true;
                }
            };

            // ========== اضافه کردن event listener به دکمه منو ==========
            const menuBtn = document.querySelector('.menu-btn');
            if (menuBtn) {
                menuBtn.addEventListener('click', toggleMenu);
            }

            // ایجاد منو در ابتدا
            createSideMenu();

            // ========== مدیریت کلیدهای میانبر ==========
            document.addEventListener('keydown', function(e) {
                // ESC برای بستن منو
                if (e.key === 'Escape' && menuOpen) {
                    toggleMenu();
                }
            });

        });
</script>
</html>
